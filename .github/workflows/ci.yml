name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A weekly run on an unchanged tree surfaces toolchain drift (Go patch releases, runner images)
  # before it lands on top of an unrelated change.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-migrations diffs against the PR base or the previous push, so it needs history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      # make check-ci calls golangci-lint; the runner does not ship it.
      #
      # Built from source rather than downloaded: golangci-lint refuses to lint a module whose
      # go directive is newer than the Go version the linter itself was built with, and the
      # v2.4.0 release binaries are built with go1.25 while this module targets 1.26. `go
      # install` compiles it with the toolchain set up above, so the two always agree.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Check
        run: make check-ci MIGRATION_BASE="$MIGRATION_BASE"
        env:
          # Pull requests compare with their base branch; pushes with the commit before the push.
          # Scheduled and manual runs have neither, and the migration check skips itself.
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
